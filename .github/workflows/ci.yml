name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags-ignore:
      - v*.*.*

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: 14
            scala: 2
          - java: 8
            scala: 3
    name: Scala v${{ matrix.scala }} / Java v${{ matrix.java }}
    steps:

      - name: Git checkout
        uses: actions/checkout@v7

      - name: Setup Scala
        uses: japgolly/setup-everything-scala@v4.1
        with:
          java-version: adoptium@1.${{ matrix.java }}
          node-version: 26

      - name: Build and test
        shell: bash
        run: sbt++field scala${{ matrix.scala }} clean test
